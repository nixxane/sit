name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config \
            libsdl2-dev libmpv-dev libcurl4-openssl-dev libgl-dev zlib1g-dev
      - run: make

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: brew install pkg-config sdl2 mpv curl
      - run: make OS=mac

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ucrt64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            make
            zip
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-mpv
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-zlib
      - name: build
        shell: msys2 {0}
        run: make OS=win
      - name: package
        shell: msys2 {0}
        run: |
          mkdir -p app
          cp sit.exe app/
          ldd sit.exe | awk '/ucrt64/ { print $3 }' | xargs -I{} cp {} app/
          cp -r vendor app/
          zip -r sit-windows.zip app
      - uses: actions/upload-artifact@v4
        with:
          name: sit-windows
          path: sit-windows.zip

  freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          run: |
            pkg install -y gmake pkgconf sdl2 mpv curl mesa-libs
            gmake CC=cc

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sit-windows
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" sit-windows.zip --generate-notes --title "sit $GITHUB_REF_NAME"

  latest:
    if: github.ref == 'refs/heads/main'
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sit-windows
      - name: publish latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest sit-windows.zip --prerelease --title "Latest build" --notes "Automatic build of $GITHUB_SHA."
